baseURL: "https://wurunsong.github.io/"
title: "lilac 的技术手记"
theme: "PaperMod"

defaultContentLanguage: "zh"
locale: "zh-CN"
hasCJKLanguage: true
timeZone: "Asia/Shanghai"
summaryLength: 90

outputs:
  home: [HTML, RSS, JSON]

params:
  description: "记录编程学习、项目实践和解决问题的过程。"
  author: "lilac"
  hideAuthor: true
  mainSections: ["posts"]
  defaultTheme: "light"
  DateFormat: "2006.01.02"
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  disableSpecial1stPost: true
  editorial:
    github: "https://github.com/wurunsong"
  footer:
    text: "保持好奇，认真记录。"

markup:
  highlight:
    noClasses: false

menus:
  main:
    - name: "首页"
      url: "/"
      weight: 5
    - name: "全部文章"
      url: "/posts/"
      weight: 10
    - name: "标签"
      url: "/tags/"
      weight: 20
    - name: "搜索"
      url: "/search/"
      weight: 30
