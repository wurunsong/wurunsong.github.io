baseURL: "https://wurunsong.github.io/"
title: "lilac的技术博客"
theme: "PaperMod"

defaultContentLanguage: "zh"
locale: "zh-CN"
hasCJKLanguage: true
timeZone: "Asia/Shanghai"

params:
  description: "记录编程学习、项目实践和解决问题的过程。"
  author: "lilac"
  mainSections: ["posts"]
  defaultTheme: "auto"
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowToc: true

markup:
  highlight:
    noClasses: false

menus:
  main:
    - name: "文章"
      url: "/posts/"
      weight: 10
    - name: "标签"
      url: "/tags/"
      weight: 20